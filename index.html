<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTP DA FORTUNA • O Mapa dos Slots</title>
    
    <link rel="preconnect" href="https://i.ibb.co" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://i.ibb.co" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: #000000;
        color: #ffffff;
        overflow-x: hidden;
      }
      .bg-app-gradient {
        background: 
          radial-gradient(900px 650px at 15% 10%, rgba(139,0,0,0.15), transparent 60%),
          radial-gradient(800px 600px at 80% 20%, rgba(0,0,0,1), transparent 60%),
          #000000;
        position: relative;
      }
      
      /* Efeito de Partículas Flutuantes - Mais Visível e Vermelho Intenso */
      .particles-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .particle {
        position: absolute;
        bottom: -20px;
        background: rgba(255, 0, 0, 0.7);
        border-radius: 50%;
        filter: blur(1px);
        animation: float-up linear infinite;
        box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
      }
      @keyframes float-up {
        0% {
          transform: translateY(0) scale(1);
          opacity: 0;
        }
        10% {
          opacity: 0.9;
        }
        85% {
          opacity: 0.4;
        }
        100% {
          transform: translateY(-110vh) scale(0.3);
          opacity: 0;
        }
      }

      .card-matte {
        background: #0a0a0a;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .text-red-neon {
        color: #ff0000;
        text-shadow: 0 0 2px #ff0000, 0 0 5px rgba(255, 0, 0, 0.2);
      }
      .top-line-neon {
        height: 2px;
        background: #ff0000;
        box-shadow: 0 0 5px #ff0000, 0 0 10px rgba(255,0,0,0.3);
      }
      .green-vivid {
        color: #00ff00;
        text-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
      }
      .bg-green-vivid {
        background-color: #00ff00;
        box-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
      }
      .matte-red-border { border: 1px solid #7f1d1d; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .poster-aspect {
        aspect-ratio: 2 / 3;
      }
      
      @keyframes pulse-red {
        0% { transform: scale(0.95); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.5; }
      }
      .animate-pulse-red {
        animation: pulse-red 1.5s infinite ease-in-out;
      }

      @keyframes pulse-subtle {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      .animate-pulse-subtle {
        animation: pulse-subtle 3s infinite ease-in-out;
      }

      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee {
        animation: marquee 20s linear infinite;
      }

      @keyframes pulse-action {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(139, 0, 0, 0.4); }
        70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(139, 0, 0, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(139, 0, 0, 0); }
      }
      .animate-pulse-action {
        animation: pulse-action 2s infinite;
      }

      .red-gradient {
        background: linear-gradient(135deg, #8b0000 0%, #ff0000 100%);
      }
      .red-shadow {
        box-shadow: 0 4px 20px -2px rgba(139, 0, 0, 0.5);
      }

      .status-red { color: #991b1b; }
      .status-orange { color: #9a3412; }
      .status-green { color: #166534; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react/": "https://esm.sh/react@19.0.0/",
    "react": "https://esm.sh/react@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@0.21.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-app-gradient min-h-screen">
    <div class="particles-container" id="particles"></div>
    
    <div class="top-line-neon fixed top-0 left-0 w-full z-[100]"></div>
    <div id="root" class="relative z-10"></div>

    <script>
      const container = document.getElementById('particles');
      const particleCount = 50; // Mais partículas para maior visibilidade
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        const size = Math.random() * 6 + 3; 
        const left = Math.random() * 100;
        const delay = Math.random() * 20;
        const duration = Math.random() * 8 + 12; // Velocidades variadas
        
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${left}%`;
        particle.style.animationDelay = `${delay}s`;
        particle.style.animationDuration = `${duration}s`;
        
        // Tons de vermelho vivos
        const colors = [
          'rgba(255, 0, 0, 0.8)', 
          'rgba(220, 20, 60, 0.7)', 
          'rgba(255, 69, 0, 0.6)',
          'rgba(139, 0, 0, 0.9)'
        ];
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
        
        container.appendChild(particle);
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
